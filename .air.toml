root = "."
tmp_dir = "tmp"

[build]
  cmd        = "go build -o ./tmp/erp-server ./cmd/api"
  bin        = "./tmp/erp-server"
  full_bin   = "./tmp/erp-server"
  delay      = 1000             # ms to wait before rebuilding after a change
  stop_on_error = false
  log        = "build-errors.log"

  include_ext = ["go", "yaml", "yml"]
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "docs"]
  exclude_regex = ["_test\\.go"]

[log]
  time = true

[color]
  build  = "yellow"
  runner = "green"
  watcher = "cyan"
  app    = "white"

[screen]
  clear_on_rebuild = true
